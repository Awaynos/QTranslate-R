# QTranslate Remake: Hyprland binds
# The launcher is packaging/linux/qtranslate-remake.
# From a source checkout you can bind run.py directly:
#   bind = CTRL ALT, Q, exec, /path/to/QTranslate-R/_local/.venv/bin/python /path/to/QTranslate-R/run.py --quick

bind = CTRL ALT, Q, exec, qtranslate-remake --quick
bind = CTRL ALT, 1, exec, qtranslate-remake --replace
bind = CTRL ALT, I, exec, qtranslate-remake --ocr
